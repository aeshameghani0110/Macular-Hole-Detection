<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Analysis Result</title>
        <style>
            *{
                color: ;
            }
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #415A80;
                color: #415A80;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                text-align: center;
            }
            #result {
                background: #D7E2E9;
                padding: 2rem;
                border-radius: 8px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }
            #result img {
                max-width: 100%;
                height: auto;
                border-radius: 8px;
                margin-bottom: 1rem;
            }
            #result p {
                font-size: 1.2rem;
                color: #415A80;
            }
        </style>
    </head>
    <body>
        <div id="result">
            <h1>Analysis Result</h1>
            <img
                id="resultImage"
                src="{{ url_for('static', filename='results.png') }}"
                alt="Analysis Result" />
            <p id="resultText">{{ result_text }}</p>
        </div>
    </body>
</html>
